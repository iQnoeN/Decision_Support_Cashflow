[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-based-microbusiness-cashflow"
version = "0.1.0"
description = "AI-Based MicroBusiness Cashflow Prediction and Liquidity Assessment"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "backend*"]
